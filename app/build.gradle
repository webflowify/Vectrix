plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tansoft.ps1emulator'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.tansoft.ps1emulator"
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName "1.0.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            // The PS1 core is unplayable when compiled at -O0 (AGP's default for
            // debug). Force an optimized native build so debug APKs run at full
            // speed; Java/Kotlin is still debuggable.
            // Debug includes x86 and x86_64 for all emulator ABIs; release is ARM-only.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release is ARM-only — the native core (PCSX ReARMed + dynarec) is
            // ARM-only. Excluding x86/x86_64 shrinks the APK and prevents
            // low-end ARM devices from loading a library built for the wrong ABI.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        prefab true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.core
    implementation libs.activity
    implementation libs.fragment
    implementation libs.constraintlayout

    // Room (for game library metadata)
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // RecyclerView + ViewPager2
    implementation libs.recyclerview
    implementation libs.viewpager2

    // Preferences (for Settings screen)
    implementation libs.preference

    // Archive extraction (for .7z support)
    implementation libs.commons.compress
    implementation libs.xz

    // Lifecycle (for service management)
    implementation libs.lifecycle.service
    implementation libs.lifecycle.extensions

    // Oboe (native audio)
    implementation 'com.google.oboe:oboe:1.10.0'

    // Glide (image loading)
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'

    // DocumentFile (for SAF export/import)
    implementation libs.documentfile

    // Testing
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}